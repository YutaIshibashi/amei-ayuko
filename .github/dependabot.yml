version: 2

# Weekly, grouped, and limited: this is a small site, and a flood of individual
# dependency PRs would just be noise. Security updates still arrive immediately
# through GitHub's own security alerts.
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday, time: '09:00', timezone: Asia/Tokyo }
    open-pull-requests-limit: 3
    groups:
      frontend:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # ESLint 10 removed context.getFilename(), which eslint-plugin-react still
      # calls. eslint-config-next depends on that plugin, so a bump to 10 makes
      # `eslint .` crash on start — it is blocked upstream, not by this repo.
      # Remove this entry once eslint-plugin-react ships ESLint 10 support.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # typescript-eslint supports `typescript >=4.8.4 <6.1.0`; on TS 7 it
      # refuses to load and `eslint .` cannot start. The scraper and e2e
      # packages have no ESLint, so they stay on 7 — this pin is frontend-only.
      # Remove once typescript-eslint ships TS 7 support
      # (typescript-eslint/typescript-eslint#10940).
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /scraper
    schedule: { interval: weekly, day: monday, time: '09:00', timezone: Asia/Tokyo }
    open-pull-requests-limit: 2
    groups:
      scraper:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      e2e:
        patterns: ['*']

  - package-ecosystem: composer
    directory: /backend
    schedule: { interval: weekly, day: monday, time: '09:00', timezone: Asia/Tokyo }
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
