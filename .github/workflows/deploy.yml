name: Deploy

# Deploys to Lolipop on every push to main. CI must pass first: this workflow
# re-runs the checks rather than trusting a previous run, because a merge
# commit is not necessarily what any single PR was tested against.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Pre-deploy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, pdo_mysql, json, curl
          coverage: none
          tools: composer:v2

      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck

      - name: PHP checks
        working-directory: backend
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          find src public ../ops -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
          php -l ../backend/bootstrap.php
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    needs: checks
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, pdo_mysql, json, curl
          coverage: none
          tools: composer:v2

      - name: Build the static export
        working-directory: frontend
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          npm ci
          npm run build

      - name: Install production dependencies for PHP
        working-directory: backend
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Assemble the release directory
        run: |
          set -euo pipefail
          RELEASE="$RUNNER_TEMP/release"
          mkdir -p "$RELEASE"

          # 1. The static export becomes the document root …
          cp -R frontend/out/. "$RELEASE/"

          # … except /data, which the sync pipeline owns in production. Shipping
          # the development fixture would overwrite the live catalogue.
          rm -rf "$RELEASE/data"

          # 2. Public PHP over the top (api/, admin/, render.php, .htaccess …)
          cp -R backend/public/. "$RELEASE/"

          # 3. The private application directory, denied by .htaccess.
          mkdir -p "$RELEASE/_app"
          cp backend/bootstrap.php "$RELEASE/_app/"
          cp -R backend/src "$RELEASE/_app/src"
          cp -R backend/templates "$RELEASE/_app/templates"
          cp -R backend/vendor "$RELEASE/_app/vendor"

          # Writable runtime directories. Nothing in them is deployed; the
          # rsync excludes below keep the server's copies untouched.
          mkdir -p "$RELEASE/_app/storage/logs" \
                   "$RELEASE/_app/storage/sync" \
                   "$RELEASE/_app/storage/cache/htmlpurifier"

          # Never ship secrets or a local environment file.
          find "$RELEASE" -name '.env' -delete
          find "$RELEASE" -name '*.md' -not -path "*/vendor/*" -delete

          echo "release assembled:"
          du -sh "$RELEASE"

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LOLIPOP_SSH_KEY }}
          SSH_HOST: ${{ secrets.LOLIPOP_SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pin the host key rather than disabling verification.
          ssh-keyscan -p "${{ secrets.LOLIPOP_SSH_PORT }}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Upload
        env:
          SSH_HOST: ${{ secrets.LOLIPOP_SSH_HOST }}
          SSH_USER: ${{ secrets.LOLIPOP_SSH_USER }}
          SSH_PORT: ${{ secrets.LOLIPOP_SSH_PORT }}
          REMOTE_PATH: ${{ secrets.LOLIPOP_REMOTE_PATH }}
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -p $SSH_PORT -i ~/.ssh/id_ed25519 -o BatchMode=yes" \
            --exclude '/data/' \
            --exclude '/products/' \
            --exclude '/uploads/' \
            --exclude '/maintenance.flag' \
            --exclude '/_app/.env' \
            --exclude '/_app/storage/' \
            "$RUNNER_TEMP/release/" \
            "$SSH_USER@$SSH_HOST:$REMOTE_PATH/"

      - name: Ensure the runtime directories exist and are writable
        env:
          SSH_HOST: ${{ secrets.LOLIPOP_SSH_HOST }}
          SSH_USER: ${{ secrets.LOLIPOP_SSH_USER }}
          SSH_PORT: ${{ secrets.LOLIPOP_SSH_PORT }}
          REMOTE_PATH: ${{ secrets.LOLIPOP_REMOTE_PATH }}
        run: |
          ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$REMOTE_PATH'/{data,products,uploads/news,uploads/main-visual} \
                      '$REMOTE_PATH'/_app/storage/{logs,sync,cache/htmlpurifier} && \
             chmod 755 '$REMOTE_PATH'/{data,products,uploads} && \
             chmod -R 750 '$REMOTE_PATH'/_app/storage"

      - name: Smoke-test the deployed site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          # A deploy that leaves the site unreachable must fail loudly.
          for path in / /shop/ /about/ /contact/ /news/ /api/settings.php; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$SITE_URL$path")
            echo "$path → $status"
            # 503 is a legitimate answer while maintenance mode is on.
            case "$status" in
              200|503) ;;
              *) echo "unexpected status for $path"; exit 1 ;;
            esac
          done

      - name: Clean up the key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
