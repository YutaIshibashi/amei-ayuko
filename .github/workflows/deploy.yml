name: Deploy

# Deploys to Lolipop on every push to main. CI must pass first: this workflow
# re-runs the checks rather than trusting a previous run, because a merge
# commit is not necessarily what any single PR was tested against.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Pre-deploy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          # Matches production, so the vendor tree is resolved and the checks
          # run against the same platform the site actually uses.
          php-version: '8.5'
          extensions: mbstring, gd, pdo_mysql, json, curl
          coverage: none
          tools: composer:v2

      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck

      - name: PHP checks
        working-directory: backend
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          find src public tests ../ops -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
          php -l bootstrap.php
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # The guards below exist because each one corresponds to a production
      # outage. CI runs them too, but CI and Deploy are independent workflows
      # triggered by the same push: a red CI run does not stop a deploy. So the
      # checks that protect production are re-run here, on the commit that is
      # actually about to be uploaded.

      # Builds the release tree and runs every PHP entry point against a stub
      # bootstrap. Catches an entry point whose `_app/bootstrap.php` path is
      # wrong for its deployed depth — invisible locally, a 500 in production.
      - name: Release layout
        run: php backend/tests/release-layout-test.php

      # Catches a PHP diagnostic that would abort a request on this version,
      # which is how a deprecation in 8.5 took every database-backed endpoint
      # down while the pipeline stayed green.
      - name: Runtime compatibility
        run: php backend/tests/runtime-compat-test.php

      # The scraper's upload retry depends on this being idempotent.
      - name: Sync staging idempotency
        run: php backend/tests/sync-staging-test.php

  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    needs: checks
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          # Matches production, so the vendor tree is resolved and the checks
          # run against the same platform the site actually uses.
          php-version: '8.5'
          extensions: mbstring, gd, pdo_mysql, json, curl
          coverage: none
          tools: composer:v2

      - name: Build the static export
        working-directory: frontend
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          npm ci
          npm run build

      - name: Install production dependencies for PHP
        working-directory: backend
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      # The last guard that cannot run in `checks`: it needs the static export,
      # which only exists after the build above. render.php rewrites the head of
      # that export, and a Next.js upgrade can break the seam silently — the
      # page still renders, but crawlers get the wrong metadata. Runs before
      # anything is uploaded.
      - name: Dynamic SEO (render.php ↔ static export)
        run: php backend/tests/seo-inject-test.php

      - name: Assemble the release directory
        # Shared with backend/tests/release-layout-test.php, which builds the
        # same tree and verifies that every PHP entry point resolves
        # _app/bootstrap.php at its deployed depth. Keeping the assembly in one
        # place is what makes that check meaningful.
        run: |
          set -euo pipefail
          ops/build-release.sh "$RUNNER_TEMP/release"
          du -sh "$RUNNER_TEMP/release"

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LOLIPOP_SSH_KEY }}
          SSH_HOST: ${{ secrets.LOLIPOP_SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pin the host key rather than disabling verification.
          ssh-keyscan -p "${{ secrets.LOLIPOP_SSH_PORT }}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Upload
        env:
          SSH_HOST: ${{ secrets.LOLIPOP_SSH_HOST }}
          SSH_USER: ${{ secrets.LOLIPOP_SSH_USER }}
          SSH_PORT: ${{ secrets.LOLIPOP_SSH_PORT }}
          REMOTE_PATH: ${{ secrets.LOLIPOP_REMOTE_PATH }}
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -p $SSH_PORT -i ~/.ssh/id_ed25519 -o BatchMode=yes" \
            --exclude '/data/' \
            --exclude '/products/' \
            --exclude '/uploads/' \
            --exclude '/maintenance.flag' \
            --exclude '/_app/.env' \
            --exclude '/_app/storage/' \
            "$RUNNER_TEMP/release/" \
            "$SSH_USER@$SSH_HOST:$REMOTE_PATH/"

      - name: Ensure the runtime directories exist and are writable
        env:
          SSH_HOST: ${{ secrets.LOLIPOP_SSH_HOST }}
          SSH_USER: ${{ secrets.LOLIPOP_SSH_USER }}
          SSH_PORT: ${{ secrets.LOLIPOP_SSH_PORT }}
          REMOTE_PATH: ${{ secrets.LOLIPOP_REMOTE_PATH }}
        run: |
          ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$REMOTE_PATH'/{data,products,uploads/news,uploads/main-visual} \
                      '$REMOTE_PATH'/_app/storage/{logs,sync,cache/htmlpurifier} && \
             chmod 755 '$REMOTE_PATH'/{data,products,uploads} && \
             chmod -R 750 '$REMOTE_PATH'/_app/storage"

      - name: Smoke-test the deployed site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          # A deploy that leaves the site unreachable must fail loudly.
          for path in / /shop/ /about/ /contact/ /news/ /api/settings.php; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$SITE_URL$path")
            echo "$path → $status"
            # 503 is a legitimate answer while maintenance mode is on.
            case "$status" in
              200|503) ;;
              *) echo "unexpected status for $path"; exit 1 ;;
            esac
          done

      - name: Clean up the key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
