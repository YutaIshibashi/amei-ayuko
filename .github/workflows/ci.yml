name: CI

# Every pull request and every push to main runs the full check set. Branch
# protection on `main` should require this workflow, so nothing reaches
# production without it.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build (static export)
        working-directory: frontend
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://amei-ayuko.jp' }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: npm run build

      - name: Verify the export produced the expected entry points
        working-directory: frontend
        run: |
          set -euo pipefail
          for path in index.html 404.html shop/index.html about/index.html \
                      contact/index.html contact/thanks/index.html \
                      news/index.html news/detail/index.html \
                      privacy-policy/index.html maintenance/index.html; do
            test -f "out/$path" || { echo "missing export: out/$path"; exit 1; }
          done
          echo "static export looks complete"

      # Shared with the E2E job so the suite tests exactly what was built.
      - name: Upload the export
        uses: actions/upload-artifact@v7
        with:
          name: frontend-out
          path: frontend/out
          retention-days: 7

  php:
    name: PHP ${{ matrix.php }} (lint, PHPStan)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.2 is the floor this project claims to support; 8.5 is what
        # production actually runs. Testing only the floor is how PHP 8.5's
        # deprecation of PDO::MYSQL_ATTR_INIT_COMMAND reached production as a
        # 500 on every database-backed endpoint while CI stayed green.
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, gd, pdo_mysql, json, curl
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Syntax check every PHP file
        run: |
          set -euo pipefail
          find backend/src backend/public backend/bootstrap.php ops -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null
          echo "php -l clean"

      - name: PHPStan
        working-directory: backend
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # Needs no database: it checks which failure surfaces, and that a
      # deprecation on this PHP version does not abort the request.
      - name: Runtime compatibility
        run: php backend/tests/runtime-compat-test.php

      # Builds the real release tree and runs every PHP entry point against a
      # stub bootstrap. The repository layout is not the deployed layout, so
      # this is the only check that sees the depth each file actually resolves
      # `_app/bootstrap.php` from.
      - name: Release layout
        run: php backend/tests/release-layout-test.php

      - name: Check migrations parse
        run: |
          set -euo pipefail
          # Cheap guard against a truncated or conflicted .sql file.
          for file in backend/migrations/*.sql; do
            grep -qiE 'create table|insert into|alter table|drop table' "$file" \
              || { echo "suspicious migration: $file"; exit 1; }
          done
          echo "migrations look intact"

  scraper:
    name: Scraper (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - name: Install
        working-directory: scraper
        run: npm ci

      - name: Typecheck
        working-directory: scraper
        run: npm run typecheck

  seo:
    name: Dynamic SEO (render.php ↔ static export)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          # Matches production, so the vendor tree is resolved and the checks
          # run against the same platform the site actually uses.
          php-version: '8.5'
          extensions: mbstring, gd, pdo_mysql, json, curl
          coverage: none
          tools: composer:v2

      - name: Download the export built by the frontend job
        uses: actions/download-artifact@v8
        with:
          name: frontend-out
          path: frontend/out

      - name: Install
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist

      # Guards the seam where PHP rewrites Next.js's <head>. A Next upgrade can
      # break this silently: the page still renders, but crawlers get the wrong
      # metadata.
      - name: Check the head injection against the real export
        run: php backend/tests/seo-inject-test.php

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Download the export built by the frontend job
        uses: actions/download-artifact@v8
        with:
          name: frontend-out
          path: frontend/out

      - name: Install
        working-directory: e2e
        run: npm ci

      - name: Install browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium webkit

      - name: Run the suite
        working-directory: e2e
        run: npm test

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
